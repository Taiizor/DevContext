# GitHub Automated Release Notes Configuration
# Documentation: https://docs.github.com/en/repositories/releasing-projects-on-github/automatically-generated-release-notes

changelog:
  exclude:
    labels:
      - "status:needs-triage"
    authors:
      - "dependabot[bot]"
      - "github-actions[bot]"
  categories:
    - title: "✨ Features & Enhancements"
      labels:
        - "enhancement"
        - "area:core"
        - "area:cli"
        - "area:vscode"
    - title: "🐛 Bug Fixes"
      labels:
        - "bug"
    - title: "🛡️ Security & Hardening"
      labels:
        - "type:security"
    - title: "⚡ Performance Optimizations"
      labels:
        - "type:performance"
    - title: "📝 Documentation & Guides"
      labels:
        - "documentation"
        - "area:docs"
    - title: "🔧 Maintenance & Dependencies"
      labels:
        - "dependencies"
        - "area:ci"
    - title: "📦 Other Changes"
      labels:
        - "*"
