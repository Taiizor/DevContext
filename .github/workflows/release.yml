name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-binaries:
    name: Build Binary (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: devcontext
            asset_name: devcontext-v${{ github.ref_name }}-linux-x64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: devcontext.exe
            asset_name: devcontext-v${{ github.ref_name }}-windows-x64.zip
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: devcontext
            asset_name: devcontext-v${{ github.ref_name }}-macos-arm64.tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            artifact_name: devcontext
            asset_name: devcontext-v${{ github.ref_name }}-macos-x64.tar.gz

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }} -p devcontext-cli

      - name: Package Archive (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir staging
          cp target/${{ matrix.target }}/release/devcontext staging/
          cp README.md LICENSE-MIT LICENSE-APACHE staging/
          cd staging
          tar -czvf ../${{ matrix.asset_name }} *
          cd ..

      - name: Package Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path staging
          Copy-Item target/${{ matrix.target }}/release/devcontext.exe staging/
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE staging/
          Compress-Archive -Path staging/* -DestinationPath ${{ matrix.asset_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  build-vsix:
    name: Package VS Code VSIX
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Extension Dependencies
        working-directory: apps/vscode-extension
        run: bun install

      - name: Package Extension VSIX
        working-directory: apps/vscode-extension
        run: bun run package

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: devcontext-vsix
          path: apps/vscode-extension/*.vsix

  create-release:
    name: Create GitHub Release Draft
    needs: [build-binaries, build-vsix]
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: false
          files: |
            release-assets/*
          generate_release_notes: true
