name: Sync Labels

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - develop
    paths:
      - '.github/labels.yml'
      - '.github/workflows/labels.yml'

permissions:
  issues: write

jobs:
  sync:
    name: Synchronize Labels
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Sync Labels
        uses: EndBug/label-sync@v2
        with:
          config-file: '.github/labels.yml'
          delete-other-labels: false
          dry-run: false
