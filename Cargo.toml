[workspace]
resolver = "2"
members = [
    "crates/devcontext-core",
    "apps/cli",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
authors = ["DevContext Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Taiizor/DevContext"
homepage = "https://github.com/Taiizor/DevContext"
readme = "README.md"
rust-version = "1.80.0"
description = "Local-first project memory system for software development"

[workspace.dependencies]
devcontext-core = { path = "crates/devcontext-core", version = "0.1.2" }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
rusqlite = { version = "0.41", features = ["bundled", "backup"] }
zip = { version = "9.1", default-features = false, features = ["deflate"] }
tempfile = "3.13"
